services:
  - type: web
    name: aimsp-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false   # jdbc:postgresql://db.xxxx.supabase.co:5432/postgres
      - key: DB_USERNAME
        sync: false   # postgres
      - key: DB_PASSWORD
        sync: false   # Supabase DB 비밀번호
      - key: GEMINI_API_KEY
        sync: false   # Render 대시보드에서 직접 입력
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: PROCUREMENT_API_KEY
        sync: false   # data.go.kr 나라장터 API 키
      - key: SARAMIN_API_KEY
        sync: false   # oapi.saramin.co.kr 사람인 API 키
    healthCheckPath: /actuator/health

  - type: web
    name: aimsp-radar-mcp
    runtime: docker
    dockerfilePath: ./mcp-server/Dockerfile
    dockerContext: ./mcp-server
    plan: free
    envVars:
      - key: MCP_API_BASE_URL
        value: https://aimsp-backend.onrender.com
      - key: MCP_API_TOKEN
        sync: false   # 백엔드 API_SECRET_TOKEN과 같은 값
      - key: MCP_SERVER_TOKEN
        sync: false   # MCP 클라이언트가 Bearer 토큰으로 제시할 별도 비밀값
    healthCheckPath: /health
